<section class="community-section">
    <div class="image-container">
        <div class="image-group left-image">
            <img src="assets/images/community/community-1.png" alt="Team meeting">
        </div>

        <div class="image-group center-image">
            <img src="assets/images/community/community-2.png" alt="Community members">
        </div>

        <div class="image-group right-image">
            <img src="assets/images/community/community-3.png" alt="Team collaboration">
        </div>
    </div>

    <div class="overlay-content">
        <h3>{{ title }}</h3>
        <h2>{{ subtitle }}</h2>
        <p>{{ description }}</p>
        <button class="join-button" (click)="onJoinClick()">{{ buttonText }}</button>
    </div>
</section>
